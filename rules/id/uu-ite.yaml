clauses:
  - key: id.uu-ite.27a
    rubric: [L1]
    kind: summary
    text: "Art. 27A: prohibits attacking another person’s honour or reputation by alleging something through an electronic system. Since 2 January 2026 the criminal provisions follow Criminal Code Art. 433 and 441."
    applies_to: [text, image, video]
  - key: id.uu-ite.28-2
    rubric: [L2]
    kind: summary
    text: "Art. 28(2): prohibits spreading information that incites hatred against individuals or groups based on race, ethnicity, religion, belief, sex, or disability. Since 2026 it follows Criminal Code Art. 243."
    applies_to: [text, image, video]

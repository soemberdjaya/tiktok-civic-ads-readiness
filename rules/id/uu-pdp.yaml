clauses:
  - key: id.uu-pdp.consent
    rubric: [L3]
    kind: summary
    text: "Art. 20–22: processing personal data needs a lawful basis, such as explicit consent. The controller must state the purpose, data types, retention period, and data subject rights."
    applies_to: [text, image, video]
  - key: id.uu-pdp.children
    rubric: [L3, L4]
    kind: summary
    text: "Art. 25: processing a child’s personal data requires consent from a parent or guardian."
    applies_to: [text, image, video]
